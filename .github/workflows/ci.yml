name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.12" ]
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run MyPy strict type check
        run: |
          python -m mypy --python-version ${{ matrix.python-version }} tools/nup/nup

      - name: Run full regression test suite
        run: |
          python tests/regression.py

      - name: Smoke test installed GUI
        if: matrix.os == 'windows-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python -m pip install ".[gui]"
          $output = nupull-gui --smoke --page auto
          $output
          if ($LASTEXITCODE -ne 0 -or -not ($output -match '^SMOKE-OK')) { exit 1 }
