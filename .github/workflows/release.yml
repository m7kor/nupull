name: Build & Verify Standalone Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Releases (explicit manual authorization gate)"
        required: true
        type: boolean
        default: false
      expected_tag:
        description: "Exact approved tag to publish (e.g. v1.0.2-rc.1)"
        required: true
        type: string
        default: "v1.0.2-rc.1"
      expected_commit:
        description: "Exact approved commit SHA to publish (must match checked out commit)"
        required: true
        type: string
      force_prerelease:
        description: "Force mark as pre-release"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build & Verify Windows x64 Executable
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[gui,dev]

      - name: "Quality Gate 1: Type Checking (MyPy)"
        run: |
          python -m mypy --python-version 3.12 tools/nup/nup

      - name: "Quality Gate 2: Full Regression Suite (168 checks)"
        run: |
          python tests/regression.py

      - name: "Quality Gate 3: End-to-End Format Validation (5 pathways)"
        run: |
          python tests/e2e_roundtrip.py

      - name: "Quality Gate 4: NCZ Stream Unit Tests"
        run: |
          python -m unittest tests/test_ncz_stream.py

      - name: "Quality Gate 4.5: Generate Build Metadata"
        run: |
          python tools/gen_build_meta.py

      - name: "Quality Gate 5: Build Executable with PyInstaller"
        run: |
          pyinstaller --noconsole --onefile --name "Nupull" --icon "assets/nupull.ico" --paths "tools/nup" --hidden-import "nup._build_meta" --collect-all nup nup_gui.py

      - name: "Quality Gate 6: Verify Binary Build Metadata and Smoke Test"
        shell: pwsh
        run: |
          $expectedCommit = (git rev-parse HEAD).Trim()
          python tools/verify_build.py $expectedCommit

      - name: Generate Checksums & Release Archive
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.2-rc.1" }
          $zipName = "Nupull-${tag}-windows-x64.zip"
          Compress-Archive -Path dist/Nupull.exe, README.md, LICENSE, CHANGELOG.md -DestinationPath $zipName
          
          # Generate SHA256 checksums
          $exeHash = (Get-FileHash -Algorithm SHA256 dist/Nupull.exe).Hash.ToLower()
          $zipHash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLower()
          "$exeHash  Nupull.exe`n$zipHash  $zipName" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Copy-Item $zipName dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: nupull-release-artifacts
          path: |
            dist/Nupull.exe
            dist/Nupull-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish Release (Explicit Authorization Gate)
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: production-release
    # Critical publication protection: Tag push alone NEVER publishes; explicit workflow_dispatch authorization required
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout repository for metadata verification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine & Validate Release Classification
        id: classify
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Processing Ref Name: $TAG"
          echo "Full Ref: $GITHUB_REF"
          echo "Current Commit SHA: $GITHUB_SHA"

          # 1. Guard against branch execution (e.g. running against main or dev branch)
          if [ "$TAG" = "main" ] || [ "$TAG" = "master" ] || [[ "$GITHUB_REF" == refs/heads/* ]]; then
            echo "::error::Cannot publish release from a branch ('$TAG'). The workflow must be dispatched against the approved release tag (e.g. refs/tags/v1.0.2-rc.1)."
            exit 1
          fi

          # 2. Verify approved tag matches workflow input
          EXPECTED_INPUT_TAG="${{ github.event.inputs.expected_tag }}"
          if [ -z "$EXPECTED_INPUT_TAG" ]; then
            echo "::error::Input 'expected_tag' is required and must not be empty"
            exit 1
          fi
          if [ "$TAG" != "$EXPECTED_INPUT_TAG" ]; then
            echo "::error::Target Tag '$TAG' does not match explicitly approved input tag '$EXPECTED_INPUT_TAG'"
            exit 1
          fi

          # 3. Verify approved commit SHA
          EXPECTED_INPUT_COMMIT="${{ github.event.inputs.expected_commit }}"
          if [ -z "$EXPECTED_INPUT_COMMIT" ]; then
            echo "::error::Input 'expected_commit' is required and must not be empty"
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$EXPECTED_INPUT_COMMIT" ]; then
            echo "::error::Current commit '$GITHUB_SHA' does not match explicitly approved commit '$EXPECTED_INPUT_COMMIT'"
            exit 1
          fi

          # 4. Extract package version from source code
          PKG_VER=$(python3 -c "import re; m = re.search(r'__version__\s*=\s*[\"\']([^\"\']+)[\"\']', open('tools/nup/nup/__init__.py').read()); print(m.group(1) if m else '')")
          echo "Package Version from source: $PKG_VER"
          if [ -z "$PKG_VER" ]; then
            echo "::error::Failed to extract package version from tools/nup/nup/__init__.py"
            exit 1
          fi

          # Export tag to outputs for release action
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # 5. Strict SemVer validation
          # Stable release pattern: vX.Y.Z
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            EXPECTED_TAG="v${PKG_VER}"
            if [ "$TAG" != "$EXPECTED_TAG" ]; then
              echo "::error::Tag '$TAG' does not match source package version '$EXPECTED_TAG'"
              exit 1
            fi
            if [ "${{ github.event.inputs.force_prerelease }}" == "true" ]; then
              echo "Classification: STABLE TAG FORCED TO PRE-RELEASE"
              echo "prerelease=true" >> $GITHUB_OUTPUT
              echo "make_latest=false" >> $GITHUB_OUTPUT
            else
              echo "Classification: STABLE RELEASE"
              echo "prerelease=false" >> $GITHUB_OUTPUT
              echo "make_latest=true" >> $GITHUB_OUTPUT
            fi

          # Pre-release / Release Candidate pattern: vX.Y.Z-(rc|beta|alpha).N
          elif [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-(rc|beta|alpha)\.([0-9]+)$ ]]; then
            EXPECTED_TAG="v${PKG_VER}"
            if [ "$TAG" != "$EXPECTED_TAG" ]; then
              echo "::error::Pre-release Tag '$TAG' does not match source package version '$EXPECTED_TAG'"
              exit 1
            fi
            echo "Classification: PRE-RELEASE / RELEASE CANDIDATE"
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT

          # Reject any malformed or unexpected tag formats
          else
            echo "::error::Malformed or unauthorized release tag '$TAG'. Only strict SemVer (vX.Y.Z) or pre-release (vX.Y.Z-(rc|beta|alpha).N) tags are permitted."
            exit 1
          fi

      - name: Download Build Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: nupull-release-artifacts
          path: release-dist

      - name: Verify Artifact Checksums
        shell: bash
        run: |
          cd release-dist
          if [ -f SHA256SUMS.txt ]; then
            echo "Verifying SHA256 checksums..."
            sha256sum -c SHA256SUMS.txt
          else
            echo "::error::SHA256SUMS.txt not found in build artifacts"
            exit 1
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.classify.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release-dist/Nupull.exe
            release-dist/Nupull-*-windows-x64.zip
            release-dist/SHA256SUMS.txt
          draft: false
          prerelease: ${{ steps.classify.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.classify.outputs.make_latest == 'true' }}
          generate_release_notes: true
