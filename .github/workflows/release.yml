name: Build Standalone Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[gui,dev]

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "Nupull" --icon "assets/nupull.ico" nup_gui.py

      - name: Verify build artifact
        run: |
          ./dist/Nupull.exe --smoke --page auto

      - name: Create release zip
        run: |
          Compress-Archive -Path dist/Nupull.exe, README.md, LICENSE -DestinationPath Nupull-Windows-x64.zip

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Nupull.exe
            Nupull-Windows-x64.zip
          draft: false
          prerelease: false
