name: Build & Verify Standalone Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Releases (manual authorization gate)"
        required: true
        type: boolean
        default: false
      force_prerelease:
        description: "Force mark as pre-release"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build & Verify Windows x64 Executable
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9dc2c792dd34633eab10a4c77d45c6b6 # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[gui,dev]

      - name: Quality Gate 1: Type Checking (MyPy)
        run: |
          python -m mypy --python-version 3.12 tools/nup/nup

      - name: Quality Gate 2: Full Regression Suite (165 checks)
        run: |
          python tests/regression.py

      - name: Quality Gate 3: End-to-End Format Validation (5 pathways)
        run: |
          python tests/e2e_roundtrip.py

      - name: Quality Gate 4: NCZ Stream Unit Tests
        run: |
          python -m unittest tests/test_ncz_stream.py

      - name: Quality Gate 5: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "Nupull" --icon "assets/nupull.ico" --paths "tools/nup" --collect-all nup nup_gui.py

      - name: Quality Gate 6: Smoke Test Packaged Executable
        run: |
          ./dist/Nupull.exe --version
          ./dist/Nupull.exe --build-info
          ./dist/Nupull.exe --smoke --page auto

      - name: Generate Checksums & Release Archive
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.2-rc.1" }
          $zipName = "Nupull-${tag}-windows-x64.zip"
          Compress-Archive -Path dist/Nupull.exe, README.md, LICENSE, CHANGELOG.md -DestinationPath $zipName
          
          # Generate SHA256 checksums
          $exeHash = (Get-FileHash -Algorithm SHA256 dist/Nupull.exe).Hash.ToLower()
          $zipHash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLower()
          "$exeHash  Nupull.exe`n$zipHash  $zipName" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Copy-Item $zipName dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: nupull-release-artifacts
          path: |
            dist/Nupull.exe
            dist/Nupull-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish Release (Protected Environment)
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: production-release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    permissions:
      contents: write

    steps:
      - name: Checkout repository for metadata verification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine & Validate Release Classification
        id: classify
        run: |
          TAG="${GITHUB_REF_NAME:-v1.0.2-rc.1}"
          echo "Processing Tag: $TAG"

          # Extract package version from source code
          PKG_VER=$(python3 -c "import re; m = re.search(r'__version__\s*=\s*[\"\']([^\"\']+)[\"\']', open('tools/nup/nup/__init__.py').read()); print(m.group(1) if m else '')")
          echo "Package Version: $PKG_VER"
          if [ -z "$PKG_VER" ]; then
            echo "::error::Failed to extract package version from tools/nup/nup/__init__.py"
            exit 1
          fi

          # Strict SemVer validation
          # 1. Stable release pattern: vX.Y.Z
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            EXPECTED_TAG="v${PKG_VER}"
            if [ "$TAG" != "$EXPECTED_TAG" ]; then
              echo "::error::Tag '$TAG' does not match source package version '$EXPECTED_TAG'"
              exit 1
            fi
            if [ "${{ inputs.force_prerelease }}" == "true" ]; then
              echo "Classification: STABLE TAG FORCED TO PRE-RELEASE"
              echo "prerelease=true" >> $GITHUB_OUTPUT
              echo "make_latest=false" >> $GITHUB_OUTPUT
            else
              echo "Classification: STABLE RELEASE"
              echo "prerelease=false" >> $GITHUB_OUTPUT
              echo "make_latest=true" >> $GITHUB_OUTPUT
            fi

          # 2. Pre-release / Release Candidate pattern: vX.Y.Z-(rc|beta|alpha).N
          elif [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-(rc|beta|alpha)\.([0-9]+)$ ]]; then
            EXPECTED_TAG="v${PKG_VER}"
            if [ "$TAG" != "$EXPECTED_TAG" ]; then
              echo "::error::Pre-release Tag '$TAG' does not match source package version '$EXPECTED_TAG'"
              exit 1
            fi
            echo "Classification: PRE-RELEASE / RELEASE CANDIDATE"
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT

          # 3. Reject any malformed or unexpected tag formats
          else
            echo "::error::Malformed or unauthorized release tag '$TAG'. Only strict SemVer (vX.Y.Z) or pre-release (vX.Y.Z-(rc|beta|alpha).N) tags are permitted."
            exit 1
          fi

      - name: Download Build Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: nupull-release-artifacts
          path: release-dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@c062e496a77e5e3d744b15096530a59918d36eb8 # v2.2.1
        with:
          files: |
            release-dist/Nupull.exe
            release-dist/Nupull-*-windows-x64.zip
            release-dist/SHA256SUMS.txt
          draft: false
          prerelease: ${{ steps.classify.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.classify.outputs.make_latest == 'true' }}
          generate_release_notes: true
